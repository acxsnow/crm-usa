# Integración continua (módulo 8, hallazgos TST-01 y TST-02): cada push y cada
# pull request corre las pruebas del backend con cobertura mínima y compila el
# frontend. Si algo falla, el merge a main no debe hacerse.
name: CI

on:
  push:
    branches: [main, CadenaB, cadenaA]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m ruff check app/api app/db app/modules/crm app/modules/field_ops app/modules/users
      # Las pruebas usan SQLite en memoria; el .env de ejemplo deja correo y SMS en consola.
      - run: cp .env.example .env
      - run: python -m pytest -q --cov=app --cov-report=term --cov-fail-under=70
      # SEG-05: ninguna dependencia con vulnerabilidades conocidas. Si falla por una
      # nueva, se actualiza el paquete (no se ignora sin dejar el motivo escrito).
      - run: pip install pip-audit && pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # SEG-03/SEG-05: las dependencias que llegan al navegador, sin vulnerabilidades
      # conocidas. Las de desarrollo (servidor de Vite) no se publican y no bloquean.
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      # Hooks después de un return temprano rompen la pantalla en ejecución (no lo ve tsc).
      - run: python3 scripts/check_hooks.py
      - run: npm run build

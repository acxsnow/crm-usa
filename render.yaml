# Producción en Render (actualizado el 2026-11-26).
#
# Este archivo DOCUMENTA cómo están configurados los servicios en Render. No está
# conectado a un Blueprint: los cambios se hacen en el dashboard y aquí se reflejan
# a mano. Editarlo no cambia producción.
#
# - Región: Oregon (EE. UU.), para usuarios en Estados Unidos.
# - Auto-deploy apagado: después de cada push a main hay que hacer Manual Deploy.
# - La API tiene un disco, así que cada deploy la deja caída unos 30-60 s.
# - Costo fijo aproximado: API $25 + BD $19 + Redis $10 + disco 10 GB $2,50.
#
# Las variables con `sync: false` son secretos o valores propios del entorno y
# solo viven en el dashboard; nunca se escriben aquí.

services:
  # API (FastAPI) + worker y beat de Celery embebidos (scripts/render_start.sh).
  - type: web
    name: crm-usa-api-acxsnow
    runtime: docker
    plan: standard # 1 CPU, 2 GB
    region: oregon
    branch: main
    autoDeployTrigger: "off"
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: crm-storage
      mountPath: /app/storage # adjuntos; debe coincidir con STORAGE_DIR
      sizeGB: 10
    envVars:
      - key: WEB_CONCURRENCY # procesos de uvicorn
        value: "3"
      - key: STORAGE_DIR
        value: /app/storage
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "14"
      - key: DATABASE_URL
        fromDatabase:
          name: crm-usa-db-acxsnow-v2
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: crm-usa-redis-acxsnow
          property: connectionString
      - key: EMAIL_PROVIDER
        sync: false
      - key: FRONTEND_APP_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: PAYMENTS_ENCRYPTION_KEY
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_ENV
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # Frontend (React + Vite) como sitio estático.
  - type: web
    name: crm-usa-frontend-acxsnow
    runtime: static
    branch: main
    autoDeployTrigger: "off"
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # La página llama a la API por su misma dirección (/api/...) y Render se la
    # pasa a la API por detrás. Así la cookie de la sesión (SameSite=strict) es
    # del mismo sitio y F5 no saca al login. El orden importa: /api/* va primero.
    # Dashboard: sitio del frontend > Redirects/Rewrites.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://crm-usa-api-acxsnow.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Relativa, para que pase por la regla de arriba. Se lee al construir:
      # después de cambiarla hay que hacer Manual Deploy del frontend.
      - key: VITE_API_BASE_URL
        value: /api/v1

  # Broker de Celery. Sin persistencia: solo guarda colas de tareas.
  - type: keyvalue
    name: crm-usa-redis-acxsnow
    plan: starter # 256 MB, 250 conexiones
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: [] # solo acceso interno

databases:
  - name: crm-usa-db-acxsnow-v2
    plan: basic-1gb # 0.5 CPU, 1 GB
    region: oregon
    postgresMajorVersion: "16"

envVarGroups:
  - name: crm-usa-common
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: EMAIL_PROVIDER
        value: console
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "14"

services:
  - type: web
    name: crm-usa-app
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    initialDeployHook: python -m scripts.seed --demo-org
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}"
    disk:
      name: crm-storage
      mountPath: /app/storage
      sizeGB: 5
    envVars:
      - fromGroup: crm-usa-common
      - key: DATABASE_URL
        fromDatabase:
          name: crm-usa-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: crm-usa-redis
          property: connectionString
      - key: STORAGE_DIR
        value: /app/storage

  - type: keyvalue
    name: crm-usa-redis
    plan: free
    maxmemoryPolicy: noeviction
    persistenceMode: off

databases:
  - name: crm-usa-db
    plan: free
